<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vintage Botanica — Undangan Pernikahan Bismi &amp; Rendi</title>
    <meta name="description" content="Undangan pernikahan Bismi Gaviar Putri &amp; Rendi Candra Maulana — Selasa, 22 Desember 2026 di Pakembaran, Kec. Slawi, Kab. Tegal." />
    <meta property="og:title" content="Vintage Botanica — Undangan Pernikahan Bismi & Rendi" />
    <meta property="og:description" content="Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Anda menghadiri pernikahan Bismi &amp; Rendi pada 22 Desember 2026." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <!-- GH_ROOT_FALLBACK_START -->
    <script>
      (function () {
        var devScript = document.querySelector('script[src*="src/main.tsx"]');
        if (!devScript) return;
        var checked = false;
        function checkStaticFallback() {
          if (checked || window.__BOTANICA_MOUNTED__) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          checked = true;
          fetch('./src/main.tsx')
            .then(function (res) {
              var ct = (res.headers.get('content-type') || '').toLowerCase();
              if (ct.indexOf('javascript') !== -1) {
                return;
              }
              var base = window.location.pathname.replace(/index\.html$/, '');
              if (!base.endsWith('/')) base += '/';
              var candidates = ['public/undangan/', 'docs/'];
              function tryNext(idx) {
                if (idx >= candidates.length) {
                  if (root) {
                    root.innerHTML =
                      '<div style="font-family:sans-serif;max-width:480px;margin:48px auto;padding:24px;text-align:center;color:#332924"><h2>Undangan Perlu Di-build</h2><p>Pastikan folder <b>public/undangan</b> atau <b>docs</b> ikut terunggah ke repository GitHub Anda.</p></div>';
                  }
                  return;
                }
                var sub = candidates[idx];
                fetch(base + sub + 'index.html', { method: 'HEAD' })
                  .then(function (r) {
                    if (r.ok) {
                      window.location.replace(
                        base + sub + window.location.search + window.location.hash
                      );
                    } else {
                      tryNext(idx + 1);
                    }
                  })
                  .catch(function () {
                    tryNext(idx + 1);
                  });
              }
              tryNext(0);
            })
            .catch(function () {});
        }
        devScript.addEventListener('error', checkStaticFallback);
        window.setTimeout(checkStaticFallback, 400);
      })();
    </script>
    <!-- GH_ROOT_FALLBACK_END -->
  </body>
</html>
