  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <!-- GH_ROOT_FALLBACK_START -->
    <script>
      (function () {
        var devScript = document.querySelector('script[src*="src/main.tsx"]');
        if (!devScript) return;
        var loaded = false;
        function loadStaticInvitation() {
          if (loaded || window.__BOTANICA_MOUNTED__) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          loaded = true;
          fetch('./src/main.tsx')
            .then(function (res) {
              var ct = (res.headers.get('content-type') || '').toLowerCase();
              if (ct.indexOf('javascript') !== -1) return;
              var s = document.createElement('script');
              s.src = './public/gh-invitation.js';
              document.body.appendChild(s);
            })
            .catch(function () {
              var s = document.createElement('script');
              s.src = './public/gh-invitation.js';
              document.body.appendChild(s);
            });
        }
        devScript.addEventListener('error', loadStaticInvitation);
        window.setTimeout(loadStaticInvitation, 350);
      })();
    </script>
    <!-- GH_ROOT_FALLBACK_END -->
  </body>
</html>
